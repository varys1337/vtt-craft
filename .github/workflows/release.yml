name: Build and publish release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

concurrency:
  group: vtt-craft-stable-release
  cancel-in-progress: false

jobs:
  release:
    name: Package VTT Craft and create GitHub release
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Validate release manifest and tag
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF_TYPE}" != "tag" ]]; then
            echo "::error::Releases must run from a version tag. For a retry, use gh workflow run release.yml --ref vX.Y.Z."
            exit 1
          fi
          gh release list --limit 100 --json tagName,isDraft,isPrerelease > "$RUNNER_TEMP/releases.json"
          node --input-type=module <<'NODE'
          import assert from "node:assert/strict";
          import fs from "node:fs";
          const manifest = JSON.parse(fs.readFileSync("module.json", "utf8"));
          const tag = `v${manifest.version}`;
          assert.equal(manifest.id, "vtt-craft");
          assert.match(manifest.version, /^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$/);
          assert.equal(process.env.GITHUB_REF_NAME, tag, "Tag must match module.json version");
          assert.equal(manifest.manifest, "https://github.com/varys1337/vtt-craft/releases/latest/download/module.json");
          assert.equal(manifest.download, `https://github.com/varys1337/vtt-craft/releases/download/${tag}/vtt-craft.zip`);
          for (const file of ["fonts/LifeCraft_Font.ttf", ...manifest.esmodules, ...manifest.styles]) {
            assert(fs.statSync(file).isFile(), `Missing runtime file: ${file}`);
          }
          for (const directory of ["fonts", "images", "scripts", "styles"]) {
            assert(fs.statSync(directory).isDirectory(), `Missing runtime directory: ${directory}`);
          }
          const version = manifest.version.split(".").map(Number);
          const releases = JSON.parse(fs.readFileSync(`${process.env.RUNNER_TEMP}/releases.json`, "utf8"));
          for (const release of releases) {
            assert.notEqual(release.tagName, tag, "Release already exists; do not overwrite published releases");
            if (release.isDraft || release.isPrerelease || !/^v\d+\.\d+\.\d+$/.test(release.tagName)) continue;
            const previous = release.tagName.slice(1).split(".").map(Number);
            const firstDifference = version.findIndex((part, index) => part !== previous[index]);
            assert(firstDifference >= 0 && version[firstDifference] > previous[firstDifference],
              `Release must be newer than ${release.tagName}`);
          }
          NODE

      - name: Syntax-check module script
        run: node --check scripts/vtt-craft.mjs

      - name: Build Foundry module zip
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          zip -qr dist/vtt-craft.zip module.json fonts images scripts styles \
            -x '*.bak' '*.lock' '*.log' '*.tmp' '*/.*'
          cp module.json dist/module.json
          unzip -t dist/vtt-craft.zip
          unzip -p dist/vtt-craft.zip module.json | cmp - dist/module.json

      - name: Publish stable GitHub release as Latest
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release create "${GITHUB_REF_NAME}" \
            dist/vtt-craft.zip dist/module.json \
            --verify-tag \
            --title "VTT Craft ${GITHUB_REF_NAME}" \
            --notes "Requires Foundry VTT 14.368 or newer. See the README for supported systems, settings, and release instructions." \
            --generate-notes \
            --latest
